<!doctype html>
<html lang="en" class="grauity-theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>One Take</title>
    <meta
      name="description"
      content="Record a lecture video from slides: only the moments you speak are kept, pauses are cut, slides follow your navigation."
    />
    <script>
      // Apply the saved theme before the first paint so a light-theme user never sees a dark flash.
      try {
        var prefs = JSON.parse(localStorage.getItem('one-take.prefs') || '{}');
        if (prefs.theme === 'light') document.documentElement.className = 'grauity-theme-light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
